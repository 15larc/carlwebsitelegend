<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Code editor window illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1b4e"/><stop offset="1" stop-color="#0f3d3a"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="440" r="160" fill="#fbbf24" opacity=".1"/>
  <!-- editor window -->

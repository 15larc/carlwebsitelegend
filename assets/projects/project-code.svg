    <line x1="200" y1="168" x2="260" y2="168" stroke="#2dd4bf"/><line x1="272" y1="168" x2="450" y2="168" stroke="#ffffff" stroke-opacity=".35"/>
    <line x1="200" y1="198" x2="300" y2="198" stroke="#fbbf24"/><line x1="312" y1="198" x2="420" y2="198" stroke="#ffffff" stroke-opacity=".3"/>
    <line x1="224" y1="228" x2="280" y2="228" stroke="#c084fc"/><line x1="292" y1="228" x2="500" y2="228" stroke="#7dd3fc"/>
    <line x1="224" y1="258" x2="330" y2="258" stroke="#ffffff" stroke-opacity=".35"/><line x1="342" y1="258" x2="400" y2="258" stroke="#fbbf24"/>
    <line x1="200" y1="288" x2="230" y2="288" stroke="#ffffff" stroke-opacity=".5"/>
    <line x1="176" y1="318" x2="250" y2="318" stroke="#c084fc"/><line x1="262" y1="318" x2="380" y2="318" stroke="#2dd4bf"/><line x1="392" y1="318" x2="470" y2="318" stroke="#ffffff" stroke-opacity=".35"/>
    <line x1="200" y1="348" x2="320" y2="348" stroke="#7dd3fc"/><line x1="332" y1="348" x2="430" y2="348" stroke="#ffffff" stroke-opacity=".3"/>

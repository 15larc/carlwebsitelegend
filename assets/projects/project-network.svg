<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Network topology illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b2a3f"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="230" fill="url(#core)"/>
  <!-- links -->
  <g stroke="#ffffff" stroke-opacity=".4" stroke-width="3" stroke-linecap="round">
    <line x1="400" y1="250" x2="160" y2="120"/>
    <line x1="400" y1="250" x2="640" y2="120"/>
    <line x1="400" y1="250" x2="160" y2="380"/>
    <line x1="400" y1="250" x2="640" y2="380"/>
    <line x1="160" y1="120" x2="90" y2="200" stroke-dasharray="2 8"/>
    <line x1="160" y1="120" x2="110" y2="60" stroke-dasharray="2 8"/>
    <line x1="640" y1="120" x2="710" y2="60" stroke-dasharray="2 8"/>
    <line x1="640" y1="120" x2="715" y2="195" stroke-dasharray="2 8"/>
    <line x1="160" y1="380" x2="90" y2="440" stroke-dasharray="2 8"/>
    <line x1="640" y1="380" x2="720" y2="440" stroke-dasharray="2 8"/>
  </g>
  <!-- core router -->
  <circle cx="400" cy="250" r="54" fill="#0b1226" stroke="#2dd4bf" stroke-width="3"/>
  <g stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M375 250h50"/><path d="M400 225v50"/>
    <path d="M382 232l36 36"/><path d="M418 232l-36 36"/>
  </g>
  <!-- switches -->
  <g>
    <rect x="125" y="95" width="70" height="50" rx="12" fill="#0b1226" stroke="#818cf8" stroke-width="2.5"/>
    <rect x="605" y="95" width="70" height="50" rx="12" fill="#0b1226" stroke="#818cf8" stroke-width="2.5"/>
    <rect x="125" y="355" width="70" height="50" rx="12" fill="#0b1226" stroke="#fbbf24" stroke-width="2.5"/>
    <rect x="605" y="355" width="70" height="50" rx="12" fill="#0b1226" stroke="#fbbf24" stroke-width="2.5"/>
    <g fill="#ffffff" opacity=".55">
      <rect x="137" y="112" width="8" height="8" rx="2"/><rect x="152" y="112" width="8" height="8" rx="2"/><rect x="167" y="112" width="8" height="8" rx="2"/>
      <rect x="617" y="112" width="8" height="8" rx="2"/><rect x="632" y="112" width="8" height="8" rx="2"/><rect x="647" y="112" width="8" height="8" rx="2"/>
      <rect x="137" y="372" width="8" height="8" rx="2"/><rect x="152" y="372" width="8" height="8" rx="2"/><rect x="167" y="372" width="8" height="8" rx="2"/>
      <rect x="617" y="372" width="8" height="8" rx="2"/><rect x="632" y="372" width="8" height="8" rx="2"/><rect x="647" y="372" width="8" height="8" rx="2"/>
    </g>
  </g>
  <!-- end devices -->
  <g fill="#0b1226" stroke="#ffffff" stroke-opacity=".6" stroke-width="2.5">
    <rect x="68" y="188" width="44" height="32" rx="6"/><rect x="88" y="42" width="44" height="32" rx="6"/>
    <rect x="688" y="42" width="44" height="32" rx="6"/><rect x="693" y="183" width="44" height="32" rx="6"/>
    <rect x="68" y="428" width="44" height="32" rx="6"/><rect x="698" y="428" width="44" height="32" rx="6"/>
  </g>
</svg>

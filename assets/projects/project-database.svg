<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Connected database tables illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1646"/><stop offset="1" stop-color="#0f3a5f"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="110" cy="440" r="150" fill="#818cf8" opacity=".14"/>
  <!-- relationship lines -->
  <g stroke="#ffffff" stroke-opacity=".45" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 9">
    <path d="M290 175 H400 V250 H470"/>
    <path d="M290 330 H350 V250 H470"/>
    <path d="M600 160 V215"/>
    <path d="M600 330 V285"/>
  </g>
  <!-- table 1 -->
  <g>
    <rect x="90" y="120" width="200" height="120" rx="14" fill="#0b1226" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="90" y="120" width="200" height="32" rx="14" fill="url(#acc)"/>
    <rect x="90" y="138" width="200" height="14" fill="url(#acc)"/>
    <rect x="108" y="164" width="14" height="8" rx="4" fill="#fbbf24"/><rect x="132" y="164" width="90" height="8" rx="4" fill="#ffffff" opacity=".35"/>
    <rect x="108" y="186" width="14" height="8" rx="4" fill="#ffffff" opacity=".2"/><rect x="132" y="186" width="120" height="8" rx="4" fill="#ffffff" opacity=".25"/>
    <rect x="108" y="208" width="14" height="8" rx="4" fill="#ffffff" opacity=".2"/><rect x="132" y="208" width="70" height="8" rx="4" fill="#ffffff" opacity=".25"/>
  </g>
  <!-- table 2 -->
  <g>
    <rect x="90" y="285" width="200" height="120" rx="14" fill="#0b1226" stroke="#ffffff" stroke-opacity=".18"/>
    <rect x="90" y="285" width="200" height="32" rx="14" fill="url(#acc)"/>
    <rect x="90" y="303" width="200" height="14" fill="url(#acc)"/>
    <rect x="108" y="329" width="14" height="8" rx="4" fill="#fbbf24"/><rect x="132" y="329" width="100" height="8" rx="4" fill="#ffffff" opacity=".35"/>
    <rect x="108" y="351" width="14" height="8" rx="4" fill="#ffffff" opacity=".2"/><rect x="132" y="351" width="110" height="8" rx="4" fill="#ffffff" opacity=".25"/>
    <rect x="108" y="373" width="14" height="8" rx="4" fill="#ffffff" opacity=".2"/><rect x="132" y="373" width="80" height="8" rx="4" fill="#ffffff" opacity=".25"/>
  </g>
  <!-- central table -->
  <g>
    <rect x="470" y="215" width="260" height="70" rx="14" fill="#0b1226" stroke="#2dd4bf" stroke-opacity=".7" stroke-width="2"/>
    <rect x="490" y="238" width="14" height="8" rx="4" fill="#fbbf24"/><rect x="514" y="238" width="120" height="8" rx="4" fill="#ffffff" opacity=".4"/>
    <rect x="490" y="258" width="14" height="8" rx="4" fill="#ffffff" opacity=".2"/><rect x="514" y="258" width="170" height="8" rx="4" fill="#ffffff" opacity=".25"/>
  </g>
  <!-- cylinders -->
  <g>
    <ellipse cx="600" cy="130" rx="46" ry="16" fill="#818cf8"/>
    <path d="M554 130 v30 a46 16 0 0 0 92 0 v-30" fill="#6366f1"/>
    <ellipse cx="600" cy="130" rx="46" ry="16" fill="#a5b4fc"/>
    <ellipse cx="600" cy="360" rx="46" ry="16" fill="#2dd4bf"/>
    <path d="M554 360 v30 a46 16 0 0 0 92 0 v-30" fill="#14b8a6"/>
    <ellipse cx="600" cy="360" rx="46" ry="16" fill="#5eead4"/>
  </g>
</svg>
